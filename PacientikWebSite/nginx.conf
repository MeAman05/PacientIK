server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Включаем сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Основной обработчик для SPA
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Правильная обработка всех файлов в _framework
    location /_framework/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        
        # Для файлов с хэшами в имени
        location ~* \.(wasm|dll|js|css|json)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # Важно! Правильные MIME типы
            types {
                application/wasm wasm;
                application/octet-stream dll;
                application/json json;
                text/javascript js;
                text/css css;
            }
        }
        
        # Особое правило для blazor.boot.json - не кэшировать
        location = /_framework/blazor.boot.json {
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma no-cache;
        }
    }

    # Кэширование статических ресурсов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback для всех остальных запросов
    error_page 404 /index.html;
}