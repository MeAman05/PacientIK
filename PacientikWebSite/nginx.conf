server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Включаем сжатие
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Основной SPA роутинг
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Правильная обработка .wasm файлов
    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Правильная обработка .dll файлов
    location ~* \.dll$ {
        add_header Content-Type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Файлы _framework
    location /_framework/ {
        try_files $uri =404;
        
        # Для blazor.boot.json - не кэшировать
        location = /_framework/blazor.boot.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma no-cache;
            expires -1;
            try_files $uri =404;
        }

        # Для остальных файлов в _framework
        location ~* \.(js|css|json|wasm|dll)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
            
            # Убеждаемся что MIME-типы правильные
            types {
                application/wasm wasm;
                application/octet-stream dll;
                application/json json;
                text/javascript js;
                text/css css;
            }
        }
    }

    # Статические файлы
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Обработка ошибок
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}