server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor needs wasm mime type
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # enable serving pre-compressed.gz files from publish
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm application/octet-stream;

    location /_framework/ {
        # immutable cache for framework files
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri.gz =404;
    }

    location / {
        # SPA fallback
        try_files $uri $uri/ /index.html;
    }

    # don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
